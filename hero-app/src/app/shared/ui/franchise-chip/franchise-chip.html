<mat-chip class="franchise-chip">
    <span class="franchise-content">
        @switch (franchise()) {
            @case ('Marvel Comics') {
                <img 
                    src="assets/franchise/marvel.png" 
                    alt="Marvel Comics"
                    class="franchise-logo"
                >
                <span class="franchise-name">
                    {{franchise()}}
                </span>

            }

            @case ('DC Comics') {
                <img 
                    src="assets/franchise/dc.png" 
                    alt="DC Comics"
                    class="franchise-logo"
                >
                <span class="franchise-name">
                    {{franchise()}}
                </span>
            }

            @default {
                <span class="franchise-name">
                    {{'-'}}
                </span>
                       
            }
        }
    </span>
</mat-chip>
