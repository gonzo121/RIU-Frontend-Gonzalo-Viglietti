<mat-chip class="super-power-chip">
    <span>
        <span class="icon-container">
            @if(superPower().icon){
                <img [src]="superPower().icon" class="super-power-icon">
            }
        </span>
        <span class="power-name">
            {{superPower().name}}

        </span>

    </span>
</mat-chip>
