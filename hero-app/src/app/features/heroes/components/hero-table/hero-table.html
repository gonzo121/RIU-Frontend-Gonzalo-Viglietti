<div class="table-container">
    <table mat-table [dataSource]="paginatedHeroes()">

        <!-- Hero data-->
        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Heroe </th>
            <td mat-cell *matCellDef="let hero"> {{hero.name}} </td>
        </ng-container>

        <ng-container matColumnDef="realName">
            <th mat-header-cell *matHeaderCellDef> Nombre Real </th>
            <td mat-cell *matCellDef="let hero"> {{hero.realName}} </td>
        </ng-container>

        <ng-container matColumnDef="franchise">
            <th mat-header-cell *matHeaderCellDef> Franquicia </th>
            <td mat-cell *matCellDef="let hero"> {{hero.franchise}} </td>
        </ng-container>

        <ng-container matColumnDef="superPowers">
            <th mat-header-cell *matHeaderCellDef> Poderes </th>
            <td mat-cell *matCellDef="let hero"> {{hero.superPowers}} </td>
        </ng-container>

        <ng-container matColumnDef="age">
            <th mat-header-cell *matHeaderCellDef> Edad </th>
            <td mat-cell *matCellDef="let hero"> {{hero.age}} </td>
        </ng-container>

        <ng-container matColumnDef="wearCape">
            <th mat-header-cell *matHeaderCellDef> Capa </th>
            <td mat-cell *matCellDef="let hero"> {{hero.wearCape ? 'Sí' : 'No'}} </td>
        </ng-container>

        <ng-container matColumnDef="fromEarth">
            <th mat-header-cell *matHeaderCellDef> De la Tierra </th>
            <td mat-cell *matCellDef="let hero"> {{hero.fromEarth ? 'Sí' : 'No'}} </td>
        </ng-container>


        <!-- Actions -->
        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef> Acciones </th>
            <td mat-cell *matCellDef="let hero">
                <button mat-icon-button color="accent" (click)="view.emit(hero)">
                    <mat-icon>visibility</mat-icon>
                </button>
                <button mat-icon-button color="primary" (click)="edit.emit(hero)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="delete.emit(hero)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <mat-paginator
        [length]="heroes().length"
        [pageSize]="pageSize()"
        [pageIndex]="pageIndex()"
        [pageSizeOptions]="[5, 10, 20]"
        (page)="onPageChange($event)">
    </mat-paginator>
</div>
